<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Contact Us – North Carolina</title>
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <header>
    <h1>Contact Us</h1>
    <nav>
      <ul>
        <li><a href="index.html">Home</a></li>
        <li><a href="capital.html">Raleigh</a></li>
        <li><a href="charlotte.html">Charlotte</a></li>
        <li><a href="wilmington.html">Wilmington</a></li>
        <li><a href="contact.html">Contact Us</a></li>
      </ul>
    </nav>
  </header>

  <main>
    <section>
      <h2>Have a Question?</h2>
      <form id="contactForm">
        <label for="firstName">First Name:</label>
        <input type="text" id="firstName" name="firstName" required />

        <label for="lastName">Last Name:</label>
        <input type="text" id="lastName" name="lastName" required />

        <label for="email">Email Address:</label>
        <input type="email" id="email" name="email" required />

        <label for="confirmEmail">Confirm Email Address:</label>
        <input type="email" id="confirmEmail" name="confirmEmail" required />

        <label for="question">Your Question:</label>
        <textarea id="question" name="question" rows="5" required></textarea>

        <button type="submit">Submit</button>
      </form>
    </section>
  </main>

  <footer>
    <p>Thank you for visiting our North Carolina site!</p>
  </footer>

  <script>
    // JavaScript validation for email confirmation
    document.getElementById("contactForm").addEventListener("submit", function (event) {
      const email = document.getElementById("email").value;
      const confirmEmail = document.getElementById("confirmEmail").value;

      if (email !== confirmEmail) {
        alert("Email addresses do not match.");
        event.preventDefault();
      }
    });
  </script>
</body>
</html>
